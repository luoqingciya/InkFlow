name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行直接取消 —— 推送频繁时没必要排队等旧提交跑完
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 显式用官方索引，绕开 uv.lock 里写死的国内镜像。
#
# uv 下载时**直接用 lock 里记录的 URL**，索引配置盖不住它 —— 镜像偶发 403
# 就会让 job 直接红，而且看起来像代码问题（2026-10-03 真发生过）。
# 设了这个变量，uv 会重新解析并按官方源下载。
#
# 本机不受影响（那边仍走镜像，快）。详见 docs/development/cicd.md。
env:
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  python:
    name: Python · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主要分发目标，Linux 覆盖 CI 常见环境。
        # 两个平台都跑，是为了提前发现路径分隔符、行尾、大小写敏感这类差异。
        os: [ubuntu-latest, windows-latest]
    env:
      # Windows runner 的控制台默认是 cp1252，脚本打印中文会 UnicodeEncodeError。
      # PYTHONUTF8 启用 PEP 540 的 UTF-8 模式，比只设 PYTHONIOENCODING 更彻底。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 同步依赖
        # --all-packages 不能省：workspace 里 uv sync 默认只装根项目依赖
        run: uv sync --all-packages

      - name: 版本号一致性
        # 版本号漂移不会让程序跑不起来，但会让发出去的包版本混乱 ——
        # 靠人记不如靠检查
        run: uv run python scripts/check_version.py

      - name: 静态检查
        run: uv run ruff check .

      - name: 格式检查
        run: uv run ruff format --check .

      - name: 类型检查
        run: uv run mypy .

      - name: 测试
        run: uv run pytest -q

  desktop:
    name: Desktop · 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        working-directory: desktop
        run: npm ci

      - name: 类型检查（主进程 / preload）
        working-directory: desktop
        run: npm run typecheck:node

      - name: 类型检查（渲染进程）
        working-directory: desktop
        run: npm run typecheck:web

      - name: 构建产物
        working-directory: desktop
        run: npm run build

      - name: 浏览器桥冒烟测试
        # 跑的是**真的 Electron 主进程 + 真的 BrowserWindow**：
        # 协议、鉴权、渲染、JS 执行都验。BrowserWindow 在无头 Linux 上
        # 需要虚拟显示，所以套 xvfb-run。
        working-directory: desktop
        run: xvfb-run -a npm run smoke:bridge

      - name: 校验打包配置
        # electron-builder 的配置错误（比如写了 schema 里不存在的键）
        # 只在真正打包时才报，而打包在 Release 里跑 —— 等发版才发现就太晚了。
        # --dir 只生成目录不生成安装包，能校验配置且不下载 NSIS 等额外资源。
        working-directory: desktop
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
