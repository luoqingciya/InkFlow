name: Browser

# 真实浏览器测试。要下约 270MB，所以**不进日常 CI**（ADR-024 的 CI 分层）：
# 日常只跑接口与桩，真实引擎在这里跑。
#
# 什么时候跑它 —— 三种触发各有各的用处：
#
# | 触发 | 抓什么 |
# |---|---|
# | 手动 | 排查时想单独跑一遍 |
# | **改了浏览器相关代码** | 回归。日常 CI 把 browser 用例排除了，不这样接上的话**改了浏览器代码在 PR 阶段根本没验过** |
# | **每天定时** | 环境漂移（runner 镜像 / 下载源变了）与偶发。代码没动，但外面的世界会动 |
#
# 耗时实测约 1 分钟（含下 271MB —— GitHub 的网快，缓存也帮得上）。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/inkflow-browser-playwright/**
      - packages/inkflow-browser-electron/**
      - packages/inkflow-core/src/inkflow_core/browser.py
      - tests/browser/**
      - desktop/src/main/browser-bridge.ts
      - .github/workflows/browser.yml
  schedule:
    # 02:00（北京时间）。定时任务只在默认分支上跑。
    - cron: "0 18 * * *"

permissions:
  contents: read

# 显式用官方索引，绕开 uv.lock 里写死的国内镜像（理由见 ci.yml 与 cicd.md）。
env:
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  browser:
    name: 真实浏览器 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 浏览器安装路径的分支在各平台上不一样，两个都要覆盖。
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 设定浏览器目录
        # runner 上下文在 job 级 env 里不可用，只能在这一步写进 GITHUB_ENV。
        # 放 runner 临时目录：不污染工作区，路径也可预期（好做缓存）。
        shell: bash
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${{ runner.temp }}/pw-browsers" >> "$GITHUB_ENV"

      - name: 缓存浏览器
        # 浏览器版本与 playwright 版本严格绑定，所以键里带上 uv.lock。
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: 同步依赖（含 browser 组）
        run: uv sync --all-packages --group browser

      - name: 安装浏览器
        # --no-sync：上面刚同步过，别让 uv run 再同步一遍把 browser 组剔掉
        run: uv run --no-sync python -m playwright install chromium-headless-shell

      - name: 契约测试（真实引擎）
        run: uv run --no-sync pytest -q -m browser
