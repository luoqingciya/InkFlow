appId: com.luoqingciya.inkflow
productName: InkFlow
copyright: Copyright © 2026 洛清辞

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"

extraResources:
  # 打包进来的 Python 后端。桌面端用户因此不需要自己装 Python。
  - from: resources/backend
    to: backend
    filter: ["**/*"]
  - from: resources/icon.png
    to: icon.png

# Windows：安装版 + 免安装压缩包双分发
#
# 免安装版用 zip 而不是 portable.exe：zip 解压后就是一个完整目录，
# 数据目录（.inkflow）与程序同级，整个文件夹拷走即可迁移；
# 而 portable.exe 每次运行会解压到临时目录，数据目录反而落不到程序旁边。
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: resources/icon.png
  # nsis 会用下面的 nsis.artifactName 覆盖；zip 沿用这一条
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: InkFlow
  artifactName: ${productName}-${version}-setup.${ext}
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  icon: resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Utility
  icon: resources/icon.png
  artifactName: ${productName}-${version}.${ext}
