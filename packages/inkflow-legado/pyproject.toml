[project]
name = "inkflow-legado"
version = "0.1.0"
description = "InkFlow 的 Legado 书源兼容层：独立实现的格式解析与规则运行时"
requires-python = ">=3.12"
dependencies = [
    "inkflow-core",
    "inkflow-source",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_legado"]
