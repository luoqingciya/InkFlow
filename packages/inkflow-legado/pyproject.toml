[project]
name = "inkflow-legado"
# 版本号从 inkflow-core 读取，全项目只有一处定义
dynamic = ["version"]
description = "InkFlow 的 Legado 书源兼容层：独立实现的格式解析与规则运行时"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "inkflow-core",
    "inkflow-source",
    # L2（@js: 规则）需要它；未启用时只是不实例化运行时，不是可选依赖
    "inkflow-js-runtime",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../inkflow-core/src/inkflow_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_legado"]
