[project]
name = "inkflow-export"
version = "0.1.0"
description = "InkFlow 导出器：TXT / EPUB / Markdown / HTML"
requires-python = ">=3.12"
dependencies = [
    "inkflow-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_export"]
