[project]
name = "inkflow-export"
# 版本号从 inkflow-core 读取，全项目只有一处定义
dynamic = ["version"]
description = "InkFlow 导出器：TXT / EPUB / Markdown / HTML"
requires-python = ">=3.12"
dependencies = [
    "inkflow-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../inkflow-core/src/inkflow_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_export"]
