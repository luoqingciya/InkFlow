[project]
name = "inkflow-core"
# 版本号是**单一来源**：只在 src/inkflow_core/__init__.py 里写一次，
# 其余包都从这里读。避免发版时漏改某一处导致版本漂移。
dynamic = ["version"]
description = "InkFlow 核心领域模型、配置与存储抽象"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/inkflow_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_core"]
