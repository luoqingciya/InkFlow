[project]
name = "inkflow-core"
version = "0.1.0"
description = "InkFlow 核心领域模型、配置与存储抽象"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_core"]
