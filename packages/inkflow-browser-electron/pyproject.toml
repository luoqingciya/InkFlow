[project]
name = "inkflow-browser-electron"
# 版本号从 inkflow-core 读取，全项目只有一处定义
dynamic = ["version"]
description = "InkFlow 浏览器运行时：桌面端 Electron 引擎（复用 Electron 自带的 Chromium）"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "inkflow-core",
    # 只用来跟桌面端的浏览器桥说话，不需要 playwright
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../inkflow-core/src/inkflow_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_browser_electron"]
