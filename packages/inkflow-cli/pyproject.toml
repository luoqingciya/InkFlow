[project]
name = "inkflow-cli"
version = "0.1.0"
description = "InkFlow 命令行客户端（纯 HTTP API 消费者）"
requires-python = ">=3.12"
dependencies = [
    "inkflow-core",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.9",
    "websockets>=13.0",
]

[project.scripts]
inkflow = "inkflow_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_cli"]
