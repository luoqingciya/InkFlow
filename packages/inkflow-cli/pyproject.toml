[project]
name = "inkflow-cli"
# 版本号从 inkflow-core 读取，全项目只有一处定义
dynamic = ["version"]
description = "InkFlow 命令行客户端（纯 HTTP API 消费者）"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "inkflow-core",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.9",
    "websockets>=13.0",
]

[project.scripts]
inkflow = "inkflow_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../inkflow-core/src/inkflow_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_cli"]
