[project]
name = "inkflow-api"
version = "0.1.0"
description = "InkFlow HTTP API 服务（FastAPI）"
requires-python = ">=3.12"
dependencies = [
    "inkflow-core",
    "inkflow-source",
    "inkflow-legado",
    "inkflow-export",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.scripts]
inkflow-server = "inkflow_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_api"]
