[project]
name = "inkflow-api"
# 版本号从 inkflow-core 读取，全项目只有一处定义
dynamic = ["version"]
description = "InkFlow HTTP API 服务（FastAPI）"
requires-python = ">=3.12"
dependencies = [
    "inkflow-core",
    "inkflow-source",
    "inkflow-legado",
    "inkflow-export",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.scripts]
inkflow-server = "inkflow_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../inkflow-core/src/inkflow_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_api"]
