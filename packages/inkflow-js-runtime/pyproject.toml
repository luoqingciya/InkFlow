[project]
name = "inkflow-js-runtime"
# 版本号从 inkflow-core 读取，全项目只有一处定义
dynamic = ["version"]
description = "InkFlow JS 运行时：Node.js sidecar 与沙箱（Legado L2）"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "inkflow-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../inkflow-core/src/inkflow_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow_js_runtime"]

# sidecar 的 .js / .json 不是 Python 文件，但必须随包分发 ——
# 打包后用户机器上不会有仓库，sidecar 只能从 wheel 里取。
[tool.hatch.build.targets.wheel.force-include]
"src/inkflow_js_runtime/sidecar" = "inkflow_js_runtime/sidecar"
